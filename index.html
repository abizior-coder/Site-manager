<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // The desktop layout is keyed on `lg`, which Tailwind puts at 1024px. That
  // is measured in CSS pixels, and Windows laptops commonly run 125–150%
  // display scaling: a 1366px screen at 150% reports 910px, so a perfectly
  // ordinary office laptop would get the phone layout. Starting `lg` at 900px
  // covers those machines while still keeping a tablet in portrait on the
  // phone layout, where it belongs.
  tailwind.config = {
    theme: { screens: { sm: "640px", md: "768px", lg: "900px", xl: "1280px", "2xl": "1536px" } },
  };
</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" content="#1B1B1A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Site Log" />
<style>
  html, body { margin: 0; padding: 0; background: #1B1B1A; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Everything lives in the bundle: Firebase setup, authentication, storage
     and the Claude proxy call. This shell deliberately holds no app logic,
     because it is cached independently of bundle.js and a stale copy used to
     leave the app wired to globals that no longer matched (PROJECT.md section 6). -->

<!-- Fully self-contained app bundle (React, icons, and all app code). -->
<script type="module" src="bundle.js?v=8ea554d0"></script>
</body>
</html>
