<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Site Log">
  <!-- Reads as a roof over a log sheet. Kept to three shapes and two colours
       so it still resolves at 48px on a home screen, where most app icons
       turn to mush. -->
  <rect width="512" height="512" rx="112" fill="#1B1B1A"/>

  <!-- The sheet: off-white, so the icon has a bright core at small sizes. -->
  <rect x="140" y="228" width="232" height="176" rx="20" fill="#F5F1E8"/>

  <!-- Logged lines. Two full, one short — a list in progress, not a finished
       document. -->
  <rect x="176" y="272" width="160" height="20" rx="10" fill="#1B1B1A" opacity="0.85"/>
  <rect x="176" y="316" width="160" height="20" rx="10" fill="#1B1B1A" opacity="0.85"/>
  <rect x="176" y="360" width="96"  height="20" rx="10" fill="#1B1B1A" opacity="0.45"/>

  <!-- The roof, in the app's red, overhanging the sheet the way a real one
       overhangs the walls. -->
  <path d="M96 216 L256 96 L416 216"
        fill="none" stroke="#DA291C" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
