# Runs every suite on every push and pull request, so a change that breaks
# the rules, the render or the pure logic is caught before the Pages deploy
# publishes it. The rules suite needs the Firestore emulator, which needs
# Java; the GitHub Ubuntu image ships one.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm ci
          npm i -g firebase-tools@14

      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Build
        run: npm run build

      - name: Bundle matches source
        run: |
          if [ -n "$(git status --porcelain bundle.js index.html)" ]; then
            echo "::error::bundle.js is stale — run 'npm run build' and commit the result."
            git --no-pager diff --stat bundle.js index.html
            exit 1
          fi

      - name: Logic, worker, render, order, dock
        run: |
          npm run test:logic
          npm run test:worker
          npm run test:render
          npm run test:order
          npm run test:dock

      - name: Firestore rules
        run: npm run test:rules
