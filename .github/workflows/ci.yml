# Runs every suite on every push and pull request, so a change that breaks
# the rules, the render or the pure logic is caught before the Pages deploy
# publishes it. The rules suite needs the Firestore emulator, which needs
# Java. jsdom 30 needs Node 22+, so the runner uses Node 24 like the desk.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm ci
          npm i -g firebase-tools@14

      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Build
        run: npm run build

      - name: Bundle matches source
        run: |
          if [ -n "$(git status --porcelain build tailwind.css index.html sw.js)" ]; then
            echo "::error::build/ or tailwind.css is stale — run 'npm run build' and commit the result."
            git --no-pager status --short build tailwind.css index.html sw.js
            exit 1
          fi

      - name: Logic, worker, render, order, dock
        run: |
          npm run test:logic
          npm run test:worker
          npm run test:render
          npm run test:order
          npm run test:dock

      - name: Firestore rules
        run: npm run test:rules
