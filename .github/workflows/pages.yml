# Deploys the site with GitHub Actions instead of the legacy Pages builder,
# and only after the CI workflow has passed for the same commit on main.
#
# The legacy builder failed repeatedly with nothing but "Page build failed." —
# once for a commit that touched only a markdown file — and left the live site
# serving a 404 while the repository looked healthy. This publishes the files
# as they are and, when something does go wrong, says what.
#
# Gated on CI since 2026-09-05: a commit once shipped with a test suite that
# did not even parse, because the deploy ran on push regardless of CI.

name: Deploy to Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tree CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the committed bundle matches the source
        run: |
          npm ci
          npm run build
          if [ -n "$(git status --porcelain build tailwind.css index.html sw.js)" ]; then
            echo "::error::build/ or tailwind.css is stale — run 'npm run build' and commit the result."
            git --no-pager status --short build tailwind.css index.html sw.js
            exit 1
          fi
          echo "build/ and tailwind.css match the source."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # One tag and one GitHub Release per version: bumping package.json and
  # CHANGELOG.md is the release act; every other deploy is a build under
  # the same version and creates nothing here.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Tag and release the version when it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "$tag exists; nothing to do"
            exit 0
          fi
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md)
          build=$(grep -oE 'site-log-build" content="[a-f0-9]+"' index.html | grep -oE '[a-f0-9]+"$' | tr -d '"')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Site Log $version (build $build)"
          git push origin "$tag"
          { printf '%s\n\n' "$notes"; printf 'Build %s, deployed from %s.\n' "$build" "$(git rev-parse --short HEAD)"; } > /tmp/notes.md
          gh release create "$tag" --title "Site Log $version" --notes-file /tmp/notes.md
