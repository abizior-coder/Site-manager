# Deploys the site with GitHub Actions instead of the legacy Pages builder,
# and only after the CI workflow has passed for the same commit on main.
#
# The legacy builder failed repeatedly with nothing but "Page build failed." —
# once for a commit that touched only a markdown file — and left the live site
# serving a 404 while the repository looked healthy. This publishes the files
# as they are and, when something does go wrong, says what.
#
# Gated on CI since 2026-09-05: a commit once shipped with a test suite that
# did not even parse, because the deploy ran on push regardless of CI.

name: Deploy to Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tree CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the committed bundle matches the source
        run: |
          npm ci
          npm run build
          if [ -n "$(git status --porcelain build tailwind.css index.html sw.js)" ]; then
            echo "::error::build/ or tailwind.css is stale — run 'npm run build' and commit the result."
            git --no-pager status --short build tailwind.css index.html sw.js
            exit 1
          fi
          echo "build/ and tailwind.css match the source."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
