<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Log</title>
<style>
  html, body { margin: 0; height: 100%; background: #1B1B1A; color: #9C9791;
    font-family: system-ui, -apple-system, sans-serif; display: flex;
    align-items: center; justify-content: center; text-align: center; }
  a { color: #DA291C; font-weight: bold; }
</style>
<!-- A wrong path under this project should land in the app rather than on a
     GitHub error page. Only same-origin paths are redirected. -->
<script>
  (function () {
    var base = "/Site-manager/";
    if (location.pathname.indexOf(base) === 0 && location.pathname !== base) {
      location.replace(base);
    }
  })();
</script>
</head>
<body>
  <div>
    <p>Site Log</p>
    <p><a href="/Site-manager/">Zur App</a></p>
  </div>
</body>
</html>
