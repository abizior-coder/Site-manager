<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Log — local test build</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #1B1B1A; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Minimal window.storage shim so the app's save/load calls work locally via
     the browser's own localStorage, instead of Claude.ai's artifact storage. -->
<script>
  (function () {
    function k(key, shared) { return (shared ? "shared:" : "local:") + key; }
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem(k(key, !!shared));
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(k(key, !!shared), value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem(k(key, !!shared));
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const p = k(prefix || "", !!shared);
        const keys = Object.keys(localStorage)
          .filter((x) => x.startsWith(p))
          .map((x) => x.slice((shared ? "shared:" : "local:").length));
        return { keys, prefix: prefix || "", shared: !!shared };
      },
    };
  })();
</script>

<!-- Fully self-contained bundle: React, ReactDOM, the icon library, and the
     whole app are all compiled into this ONE plain script. No ES modules,
     no import maps, no CDN dependency for the app code itself — this loads
     the same way whether you double-click the file or serve it locally. -->
<script src="bundle.js"></script>
</body>
</html>
